<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dalsson — independent workday practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --paper:    #F5F2EC;     /* off-white */
  --paper-2:  #EFEBE2;     /* card paper */
  --ink:      #161514;     /* deep charcoal */
  --ink-soft: #2A2825;
  --ink-mute: rgba(22,21,20,0.62);
  --ink-line: rgba(22,21,20,0.14);
  --ink-line-strong: rgba(22,21,20,0.28);

  --accent:   #E84A1C;     /* signature terracotta-red */
  --accent-deep: #C03A14;

  /* saturated service blocks — editorial, not candy */
  --blk-ink:    #161514;
  --blk-ochre:  #B8732C;
  --blk-slate:  #2E4756;

  --serif: 'Fraunces', 'Tiempos Headline', Georgia, serif;
  --serif-alt: 'Instrument Serif', 'Fraunces', Georgia, serif;
  --sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:  'JetBrains Mono', ui-monospace, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.46, 0.64, 1);
}

/* scroll-driven progress rail (fixed left edge) */
.progress-rail {
  position: fixed;
  top: 0; left: 0;
  width: 3px; height: 100vh;
  z-index: 60;
  pointer-events: none;
  background: rgba(22,21,20,0.06);
}
.progress-rail .fill {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 0%;
  background: linear-gradient(180deg, #E84A1C 0%, #B8732C 50%, #2E4756 100%);
  transition: height 80ms linear;
}
.progress-rail .glyph {
  position: absolute;
  left: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
  transform: translateY(-50%);
  transition: top 80ms linear;
}

/* fade-up reveal */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 900ms var(--ease), transform 900ms var(--ease);
}
.reveal.is-in {
  opacity: 1;
  transform: translateY(0);
}
.reveal.delay-1 { transition-delay: 80ms; }
.reveal.delay-2 { transition-delay: 160ms; }
.reveal.delay-3 { transition-delay: 240ms; }
.reveal.delay-4 { transition-delay: 320ms; }

@keyframes float-y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes float-y-2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
@keyframes drift-x { 0%,100% { transform: translateX(0); } 50% { transform: translateX(18px); } }
@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
@keyframes pulse-ring {
  0%   { transform: scale(0.6); opacity: 0; }
  20%  { opacity: 0.7; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes blink-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes wobble {
  0%,100% { transform: rotate(-1.5deg); }
  50% { transform: rotate(1.5deg); }
}
@keyframes word-cycle {
  0%, 22% { transform: translateY(0); }
  25%, 47% { transform: translateY(-1.06em); }
  50%, 72% { transform: translateY(-2.12em); }
  75%, 97% { transform: translateY(-3.18em); }
  100% { transform: translateY(-4.24em); }
}
@keyframes grow-bar {
  from { transform: scaleY(0); }
  to { transform: scaleY(1); }
}
@keyframes orbit {
  from { transform: rotate(0deg) translateX(var(--r)) rotate(0deg); }
  to   { transform: rotate(360deg) translateX(var(--r)) rotate(-360deg); }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01', 'cv11';
}
img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }

::selection { background: var(--accent); color: var(--paper); }

.container { max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); }
.lower { text-transform: lowercase; }

/* ============================================================
   MARQUEE — top, thin
   ============================================================ */
.marquee {
  position: relative;
  background: var(--ink);
  color: var(--paper);
  border-bottom: 1px solid rgba(245,242,236,0.08);
  overflow: hidden;
  height: 38px;
  display: flex;
  align-items: center;
}
.marquee-track {
  display: flex;
  gap: 56px;
  white-space: nowrap;
  animation: marquee 48s linear infinite;
  padding-left: 56px;
}
.marquee-item {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.78);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.marquee-item .dot {
  display: inline-block;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
}
.marquee-item .star {
  color: rgba(245,242,236,0.4);
  font-family: var(--serif);
  font-size: 14px;
  margin-left: 36px;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(245,242,236,0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--ink-line);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
}
.nav-brand {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--ink);
  display: inline-flex;
  align-items: baseline;
  gap: 0;
}
.nav-brand .stop { color: var(--accent); margin-left: 1px; }
.nav-links {
  display: flex;
  gap: 36px;
}
.nav-links a {
  font-size: 13.5px;
  letter-spacing: 0.01em;
  color: var(--ink-soft);
  position: relative;
  padding: 6px 0;
  transition: color 200ms var(--ease);
}
.nav-links a:hover { color: var(--ink); }
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 0; height: 1px;
  background: var(--accent);
  transition: width 280ms var(--ease);
}
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--paper);
  background: var(--ink);
  padding: 11px 20px 12px;
  border-radius: 999px;
  transition: background 200ms var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.nav-cta:hover { background: var(--accent); }
.nav-cta .arr { font-size: 14px; }

@media (max-width: 820px) {
  .nav-links { display: none; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
  padding: clamp(80px, 12vh, 160px) 0 clamp(64px, 8vh, 120px);
  position: relative;
}
.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 56px;
}
.hero-eyebrow .line { flex: 0 0 56px; height: 1px; background: var(--ink-line-strong); }
.hero-eyebrow .accent-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}

.hero h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(64px, 11vw, 184px);
  line-height: 1.0;
  letter-spacing: -0.04em;
  margin: 0 0 64px;
  color: var(--ink);
  text-wrap: balance;
  font-variation-settings: "opsz" 144, "SOFT" 30;
}
.hero h1 .em-accent {
  color: var(--accent);
  font-family: var(--serif-alt);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.02em;
}
.hero h1 .stop { color: var(--accent); }

/* word-cycler: vertically rotates through alternates */
.word-cycle {
  position: relative;
  display: inline-block;
  height: 1.06em;
  vertical-align: top;
  overflow: hidden;
  color: var(--accent);
  font-family: var(--serif-alt);
  font-style: italic;
  font-weight: 400;
}
.word-cycle .reel {
  display: inline-block;
  animation: word-cycle 9s var(--ease) infinite;
}
.word-cycle .reel span {
  display: block;
  height: 1.06em;
  line-height: 1.06em;
  white-space: nowrap;
}

/* underline sweep on hero h1 phrase */
.uline {
  position: relative;
  display: inline-block;
}
.uline::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0.04em;
  width: 100%; height: 2px;
  background: var(--accent);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1.4s var(--ease) 0.6s;
}
.is-loaded .uline::after { transform: scaleX(1); }

.hero-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(40px, 6vw, 96px);
  align-items: end;
  margin-top: 24px;
}
.hero-lede {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(18px, 1.5vw, 22px);
  line-height: 1.45;
  color: var(--ink-soft);
  max-width: 42ch;
  margin: 0 0 36px;
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  color: var(--paper);
  background: var(--ink);
  padding: 22px 32px 22px 28px;
  border-radius: 999px;
  transition: background 240ms var(--ease), transform 240ms var(--ease);
}
.hero-cta:hover { background: var(--accent); transform: translateX(4px); }
.hero-cta .arr-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: transform 240ms var(--ease);
}
.hero-cta:hover .arr-circle { transform: rotate(-45deg); }

.hero-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-self: end;
  padding-bottom: 8px;
}
.hero-meta .row { display: flex; gap: 16px; align-items: baseline; }
.hero-meta .k { color: var(--ink-mute); width: 86px; flex-shrink: 0; }
.hero-meta .v { color: var(--ink); letter-spacing: 0.04em; }

/* hero image */
.hero-image-wrap {
  margin-top: clamp(48px, 8vh, 120px);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  aspect-ratio: 16/7;
  background: var(--ink);
  box-shadow: 0 30px 60px -30px rgba(20,18,16,0.18), 0 0 0 1px rgba(20,18,16,0.06);
}
.hero-image-wrap.rail {
  background: #0F0E0D;
  border: 1px solid rgba(20,18,16,0.08);
  aspect-ratio: 16/10;
  margin-bottom: 32px;
  padding: 14px;
  gap: 0;
}
.hero-image-wrap.rail .rail-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  width: 100%;
  height: 100%;
  transition: grid-template-columns 0.6s cubic-bezier(0.2,0.7,0.2,1);
}
@media (min-width: 1025px) {
  .hero-image-wrap.rail .rail-grid:has(.rail-panel:nth-child(1).rail-panel-expanded) { grid-template-columns: 1.55fr 1fr 1fr 1fr 1fr; }
  .hero-image-wrap.rail .rail-grid:has(.rail-panel:nth-child(2).rail-panel-expanded) { grid-template-columns: 1fr 1.55fr 1fr 1fr 1fr; }
  .hero-image-wrap.rail .rail-grid:has(.rail-panel:nth-child(3).rail-panel-expanded) { grid-template-columns: 1fr 1fr 1.55fr 1fr 1fr; }
  .hero-image-wrap.rail .rail-grid:has(.rail-panel:nth-child(4).rail-panel-expanded) { grid-template-columns: 1fr 1fr 1fr 1.55fr 1fr; }
  .hero-image-wrap.rail .rail-grid:has(.rail-panel:nth-child(5).rail-panel-expanded) { grid-template-columns: 1fr 1fr 1fr 1fr 1.55fr; }
}
.hero-image-wrap.rail .rail-panel {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 28px 24px;
  isolation: isolate;
  transition: transform 0.5s cubic-bezier(0.2,0.7,0.2,1);
  cursor: pointer;
  min-width: 0;
}
.hero-image-wrap.rail .rail-panel.rail-panel-expanded { cursor: default; }
.hero-image-wrap.rail .rail-panel:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.hero-image-wrap.rail .rail-panel:hover { transform: translateY(-3px); }
.hero-image-wrap.rail .rail-photo {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  transition: transform 6s ease-out;
}
.hero-image-wrap.rail .rail-panel:hover .rail-photo { transform: scale(1.04); }
.hero-image-wrap.rail .rail-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(15,14,13,0.18) 0%, rgba(15,14,13,0.55) 70%, rgba(15,14,13,0.85) 100%);
  z-index: 1;
}
.hero-image-wrap.rail .rail-panel-expanded .rail-overlay {
  background: linear-gradient(180deg, rgba(15,14,13,0.45) 0%, rgba(15,14,13,0.75) 60%, rgba(15,14,13,0.92) 100%);
}

.hero-image-wrap.rail .rail-label {
  position: relative;
  z-index: 2;
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(20px, 2.2vw, 28px);
  color: var(--paper);
  letter-spacing: -0.01em;
  margin: 0;
  text-transform: lowercase;
}
.hero-image-wrap.rail .rail-label-big {
  font-size: clamp(28px, 3.2vw, 44px);
  font-weight: 500;
  margin-bottom: 14px;
}

.hero-image-wrap.rail .rail-plus {
  position: absolute;
  z-index: 2;
  bottom: 24px; left: 24px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(245,242,236,0.12);
  border: 1px solid rgba(245,242,236,0.3);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.25s, transform 0.25s;
}
.hero-image-wrap.rail .rail-plus:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: rotate(90deg);
}

/* Expanded panel content */
.hero-image-wrap.rail .rail-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  color: var(--paper);
  animation: rail-fade-in 0.5s 0.15s ease-out both;
}
@keyframes rail-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-image-wrap.rail .rail-lede {
  font-family: var(--serif-alt);
  font-style: italic;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.45;
  color: rgba(245,242,236,0.88);
  margin: 0 0 22px 0;
  max-width: 28ch;
}
.hero-image-wrap.rail .rail-links {
  list-style: none;
  padding: 0;
  margin: 0 0 auto 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.hero-image-wrap.rail .rail-links a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--paper);
  text-decoration: none;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  font-weight: 500;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(245,242,236,0.18);
  padding: 9px 0;
  transition: color 0.2s, border-color 0.2s;
}
.hero-image-wrap.rail .rail-links a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.hero-image-wrap.rail .rail-link-arr {
  font-size: 14px;
  transition: transform 0.2s;
}
.hero-image-wrap.rail .rail-links a:hover .rail-link-arr { transform: translateX(3px); }

/* Floating callout card inside expanded panel */
.hero-image-wrap.rail .rail-callout {
  margin-top: 22px;
  background: rgba(15,14,13,0.78);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 14px 16px;
  backdrop-filter: blur(8px);
}
.hero-image-wrap.rail .rail-callout-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper);
  margin-bottom: 6px;
}
.hero-image-wrap.rail .rail-callout-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px;
  background: var(--accent);
  color: var(--paper);
  font-family: var(--serif);
  font-style: italic;
  font-weight: 700;
  font-size: 12px;
  border-radius: 2px;
}
.hero-image-wrap.rail .rail-callout-body {
  font-family: var(--sans);
  font-size: 12.5px;
  line-height: 1.5;
  color: rgba(245,242,236,0.82);
  margin: 0;
}
.hero-image-wrap.rail .rail-callout-body a {
  color: var(--paper);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.hero-image-wrap.rail .rail-callout-body a:hover { color: var(--accent); }

/* corner labels — keep but adjust for dark frame */
.hero-image-wrap.rail .tk-corner-tl {
  position: absolute;
  top: -28px;
  left: 0;
  color: rgba(20,18,16,0.6);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 10px;
}
.hero-image-wrap.rail .tk-corner-tl .c-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #E84A1C;
}
.hero-image-wrap.rail .tk-corner-br {
  position: absolute;
  bottom: -28px;
  right: 0;
  color: rgba(20,18,16,0.6);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

@media (max-width: 1024px) {
  .hero-image-wrap.rail { aspect-ratio: auto; height: auto; }
  .hero-image-wrap.rail .rail-grid {
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 220px;
    transition: none;
  }
  .hero-image-wrap.rail .rail-panel-expanded {
    grid-column: 1 / -1;
    grid-row: span 3;
    min-height: 620px;
  }
  .hero-image-wrap.rail .rail-panel-expanded .rail-content {
    height: auto;
    padding-bottom: 8px;
  }
}

@media (max-width: 560px) {
  .hero-image-wrap.rail .rail-grid {
    grid-template-columns: 1fr;
    grid-auto-rows: minmax(180px, auto);
  }
  .hero-image-wrap.rail .rail-panel-expanded {
    grid-row: auto;
    min-height: 0;
  }
  .hero-image-wrap.rail .rail-panel-expanded .rail-content {
    padding-top: 60px;
    padding-bottom: 24px;
    height: auto;
  }
}

.hero-image-wrap svg { width: 100%; height: 100%; display: block; }

/* animated layers inside hero scene */
.hs-orbit {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.hs-orbit-center {
  position: absolute;
  left: 50%; top: 64%;
  width: 0; height: 0;
}
.hs-orbit-mark {
  position: absolute;
  left: 0; top: 0;
  --r: 220px;
  width: 14px; height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: #E84A1C;
  animation: orbit 18s linear infinite;
  box-shadow: 0 0 0 4px rgba(232,74,28,0.18);
}
.hs-orbit-mark.m2 { --r: 320px; width: 8px; height: 8px; background: rgba(245,242,236,0.7); animation-duration: 26s; animation-direction: reverse; box-shadow: none; margin: -4px 0 0 -4px; }
.hs-orbit-mark.m3 { --r: 420px; width: 4px; height: 4px; background: #E84A1C; animation-duration: 34s; box-shadow: 0 0 0 8px rgba(232,74,28,0.06); margin: -2px 0 0 -2px; }
.hs-orbit-mark.m4 { --r: 160px; width: 6px; height: 6px; background: rgba(245,242,236,0.4); animation-duration: 14s; animation-direction: reverse; box-shadow: none; margin: -3px 0 0 -3px; }

.hs-pulse {
  position: absolute;
  left: 50%; top: 64%;
  width: 60px; height: 60px;
  border: 1px solid rgba(232,74,28,0.6);
  border-radius: 50%;
  margin: -30px 0 0 -30px;
  animation: pulse-ring 4.6s ease-out infinite;
  pointer-events: none;
}
.hs-pulse.p2 { animation-delay: 1.5s; }
.hs-pulse.p3 { animation-delay: 3s; }

.hs-typering {
  position: absolute;
  left: 50%; top: 64%;
  width: 280px; height: 280px;
  margin: -140px 0 0 -140px;
  animation: spin-slow 80s linear infinite;
  pointer-events: none;
  opacity: 0.55;
}
.hs-typering svg { width: 100%; height: 100%; }

.hs-corner-counter {
  position: absolute;
  bottom: 24px; left: 24px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.7);
  display: flex; gap: 14px; align-items: center;
}
.hs-corner-counter .num {
  font-family: var(--serif-alt);
  font-style: italic;
  font-size: 22px;
  color: #E84A1C;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 400;
}
.hs-corner-counter .cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--paper);
  margin-left: 2px;
  animation: blink-cursor 1.1s steps(2) infinite;
}

.hero-image-tag {
  position: absolute;
  bottom: 24px; right: 24px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.6);
}
.hero-image-corner {
  position: absolute;
  top: 24px; left: 24px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.62);
  display: flex; align-items: center; gap: 10px;
}
.hero-image-corner .c-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

@media (max-width: 820px) {
  .hero-bottom { grid-template-columns: 1fr; gap: 36px; }
  .hero-meta { padding-bottom: 0; }
}

/* ============================================================
   SERVICE CAROUSEL
   ============================================================ */
.services {
  padding: clamp(96px, 14vh, 180px) 0 clamp(64px, 8vh, 96px);
  position: relative;
}
.services-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 64px;
  gap: 40px;
}
.services-head h2 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1;
  letter-spacing: -0.025em;
  margin: 0;
  max-width: 14ch;
  text-wrap: balance;
}
.services-head h2 .em-accent { color: var(--accent); font-style: italic; }
.services-eyebrow {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
  align-self: start;
  padding-top: 8px;
}

.services-stage {
  position: relative;
  height: clamp(420px, 56vh, 580px);
  overflow: hidden;
  border-radius: 14px;
}
.svc-card {
  position: absolute;
  inset: 0;
  padding: clamp(40px, 5vw, 64px);
  color: var(--paper);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  opacity: 0;
  transform: translateY(24px);
  pointer-events: none;
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
}
.svc-card.is-active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.svc-card[data-block="ink"]    { background: var(--blk-ink); }
.svc-card[data-block="ochre"]  { background: var(--blk-ochre); }
.svc-card[data-block="slate"]  { background: var(--blk-slate); }

/* drifting decorative SVG inside each card */
.svc-deco {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.4;
  z-index: 0;
}
.svc-deco svg { width: 100%; height: 100%; display: block; }
.svc-deco .ring-1 { animation: spin-slow 60s linear infinite; transform-origin: center; transform-box: fill-box; }
.svc-deco .ring-2 { animation: spin-rev 90s linear infinite; transform-origin: center; transform-box: fill-box; }
.svc-deco .float-a { animation: float-y 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.svc-deco .float-b { animation: float-y-2 7.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.svc-left, .svc-right { position: relative; z-index: 1; }

/* sweep wipe on enter */
.svc-card.is-active::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, rgba(245,242,236,0) 30%, rgba(245,242,236,0.08) 50%, rgba(245,242,236,0) 70%);
  transform: translateX(-100%);
  animation: svc-sweep 1.4s var(--ease) forwards;
  pointer-events: none;
  z-index: 2;
}
@keyframes svc-sweep {
  to { transform: translateX(100%); }
}

.svc-left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 100%;
}
.svc-counter {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.18em;
  display: flex;
  align-items: center;
  gap: 14px;
  opacity: 0.78;
}
.svc-counter .bar {
  flex: 1;
  height: 1px;
  background: rgba(245,242,236,0.28);
  max-width: 96px;
}
.svc-name {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(48px, 6vw, 96px);
  line-height: 0.96;
  letter-spacing: -0.03em;
  margin: 0;
  text-wrap: balance;
}
.svc-name .stop { color: var(--accent); }
.svc-card[data-block="ink"] .svc-name .stop { color: var(--accent); }
.svc-card[data-block="ochre"] .svc-name .stop { color: var(--paper); }
.svc-card[data-block="slate"] .svc-name .stop { color: var(--accent); }

.svc-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  gap: 32px;
  align-self: stretch;
}
.svc-desc {
  font-family: var(--serif);
  font-size: clamp(20px, 1.6vw, 26px);
  font-weight: 400;
  line-height: 1.4;
  margin: 0;
  max-width: 36ch;
  opacity: 0.92;
  text-wrap: pretty;
}
.svc-outcomes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px 32px;
  width: 100%;
  border-top: 1px solid rgba(245,242,236,0.18);
  padding-top: 32px;
}
.svc-outcome .label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 8px;
}
.svc-outcome .value {
  font-family: var(--serif);
  font-size: clamp(18px, 1.5vw, 22px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.005em;
}

.svc-controls {
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.svc-dots {
  display: flex;
  gap: 10px;
}
.svc-dot {
  width: 28px; height: 2px;
  background: var(--ink-line-strong);
  cursor: pointer;
  transition: background 240ms var(--ease);
}
.svc-dot.is-active { background: var(--accent); }
.svc-arrows { display: flex; gap: 14px; }
.svc-arrow {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid var(--ink-line-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  font-size: 18px;
  transition: background 200ms var(--ease), color 200ms var(--ease), border-color 200ms var(--ease);
}
.svc-arrow:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

@media (max-width: 820px) {
  .svc-card { grid-template-columns: 1fr; gap: 28px; }
  .svc-outcomes { grid-template-columns: 1fr 1fr; }
}

/* ============================================================
   SCROLL MANIFESTO — sticky pin, lines reveal
   ============================================================ */
.manifesto {
  position: relative;
  background: var(--ink);
  color: var(--paper);
}
.manifesto-stage {
  height: 380vh;       /* scroll length */
  position: relative;
}
.manifesto-pin {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.manifesto-bg {
  position: absolute; inset: 0;
  pointer-events: none;
}
.manifesto-bg svg { width: 100%; height: 100%; display: block; }
.manifesto-content {
  position: relative;
  z-index: 2;
  max-width: 1320px;
  width: 100%;
  padding: 0 clamp(20px, 4vw, 56px);
  display: grid;
  grid-template-columns: minmax(280px, 0.85fr) 1.6fr;
  gap: clamp(48px, 6vw, 96px);
  align-items: center;
}
.manifesto-eyebrow {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.5);
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 32px;
}
.manifesto-eyebrow .line { width: 56px; height: 1px; background: rgba(245,242,236,0.35); }

/* LEFT COLUMN — numeral plate */
.manifesto-plate {
  position: relative;
  aspect-ratio: 1 / 1.18;
  max-width: 460px;
  border: 1px solid rgba(245,242,236,0.14);
  border-radius: 6px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(245,242,236,0.025), rgba(245,242,236,0));
  overflow: hidden;
}
.manifesto-plate .plate-corner {
  position: absolute;
  width: 14px; height: 14px;
  border: 1px solid var(--accent);
}
.manifesto-plate .plate-corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.manifesto-plate .plate-corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.manifesto-plate .plate-corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.manifesto-plate .plate-corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.plate-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.78);
  position: relative;
  z-index: 2;
}
.plate-head .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }

.plate-numeral {
  font-family: var(--serif);
  font-weight: 300;
  font-style: italic;
  font-size: clamp(72px, 9vw, 132px);
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--paper);
  position: absolute;
  bottom: 22px;
  left: 28px;
  margin: 0;
  z-index: 3;
  width: 1.6em;
  height: 1.1em;
  text-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 1px 0 rgba(0,0,0,0.4);
}
.plate-numeral .num {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 700ms var(--ease), transform 700ms var(--ease);
}
.plate-numeral .num.is-active {
  opacity: 1;
  transform: translateY(0);
}
.plate-numeral .num .stop { color: var(--accent); font-style: normal; }

.plate-motif {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  border-radius: 6px;
  overflow: hidden;
}
.motif-wrap {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 900ms var(--ease), transform 1200ms var(--ease);
  transform: scale(1.04);
}
.motif-wrap.is-active { opacity: 1; transform: scale(1); }
.motif-photo {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center 25%;
  filter: grayscale(0.35) contrast(1.06) brightness(0.78) saturate(0.85);
}
.motif-tint {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 70% 30%, rgba(232,74,28,0.18), transparent 60%),
    linear-gradient(180deg, rgba(22,21,20,0.10) 0%, rgba(22,21,20,0.55) 60%, rgba(22,21,20,0.85) 100%);
}
.motif-grain {
  position: absolute;
  inset: 0;
  opacity: 0.7;
  mix-blend-mode: overlay;
}
.motif-ring {
  position: absolute;
  inset: 18px;
  border: 1px solid rgba(245,242,236,0.12);
  border-radius: 4px;
  pointer-events: none;
}

.plate-foot {
  position: absolute;
  top: 22px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: start;
  z-index: 2;
}
.plate-foot .pf-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.85);
  max-width: 18ch;
  text-wrap: balance;
}
.plate-foot .pf-meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: rgba(245,242,236,0.55);
}

/* RIGHT COLUMN — text */
.manifesto-lines {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(36px, 4.6vw, 76px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  max-width: 22ch;
  position: relative;
  min-height: 4.6em;
}
.manifesto-line {
  position: absolute;
  inset: 0;
  display: block;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 700ms var(--ease), transform 700ms var(--ease);
  pointer-events: none;
}
.manifesto-line.is-active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.manifesto-line .em-accent { color: var(--accent); font-style: italic; }

@media (max-width: 1100px) {
  .manifesto-content {
    grid-template-columns: minmax(220px, 0.7fr) 1.4fr;
    gap: 36px;
  }
  .manifesto-plate { padding: 20px; }
  .plate-numeral { font-size: clamp(110px, 18vw, 200px); }
  .manifesto-lines { font-size: clamp(30px, 4.4vw, 56px); }
}
@media (max-width: 720px) {
  .manifesto-content {
    grid-template-columns: 1fr;
    gap: 28px;
    padding-top: 0;
  }
  .manifesto-plate {
    aspect-ratio: 1.6 / 1;
    max-width: none;
    width: 100%;
    padding: 18px;
  }
  .plate-numeral {
    font-size: 88px;
    bottom: 14px;
    left: 18px;
  }
  .plate-foot {
    top: 14px;
    left: 18px;
    right: 18px;
  }
  .manifesto-lines {
    font-size: clamp(28px, 5.8vw, 38px);
    min-height: 5.6em;
  }
}
.manifesto-line .em-accent { color: var(--accent); font-style: italic; }
.manifesto-counter {
  position: absolute;
  bottom: 40px; right: clamp(20px, 4vw, 56px);
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  color: rgba(245,242,236,0.55);
  display: flex; gap: 8px; align-items: center;
}
.manifesto-counter .bar {
  width: 64px; height: 1px;
  background: rgba(245,242,236,0.2);
  position: relative;
}
.manifesto-counter .bar-fill {
  position: absolute;
  inset: 0;
  background: var(--accent);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 480ms var(--ease);
}

/* ============================================================
   STAT STRIP
   ============================================================ */
.stats {
  padding: clamp(120px, 18vh, 200px) 0;
  border-bottom: 1px solid var(--ink-line);
}
.stats-head {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 80px;
}
.stats-head .line { width: 56px; height: 1px; background: var(--ink-line-strong); }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(36px, 5vw, 72px);
}
.stat {
  border-top: 1px solid var(--ink-line-strong);
  padding-top: 32px;
}
.stat .n {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(96px, 12vw, 200px);
  line-height: 0.86;
  letter-spacing: -0.04em;
  color: var(--ink);
  font-variant-numeric: lining-nums;
}
.stat .n .accent { color: var(--accent); }
.stat .l {
  margin-top: 28px;
  font-family: var(--serif);
  font-size: clamp(17px, 1.3vw, 20px);
  line-height: 1.4;
  color: var(--ink-soft);
  max-width: 28ch;
  font-weight: 400;
}
.stat .meta {
  margin-top: 16px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
@media (max-width: 820px) {
  .stats-grid { grid-template-columns: 1fr; gap: 64px; }
}

/* ============================================================
   BENTO CASE STUDIES
   ============================================================ */
.bento-section {
  padding: clamp(96px, 12vh, 160px) 0;
}
.bento-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 64px;
  gap: 40px;
}
.bento-head h2 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1;
  letter-spacing: -0.025em;
  margin: 0;
  max-width: 14ch;
}
.bento-head h2 .em-accent { color: var(--accent); font-style: italic; }
.bento-head a {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  border-bottom: 1px solid var(--ink-line-strong);
  padding-bottom: 4px;
  transition: border-color 200ms var(--ease), color 200ms var(--ease);
}
.bento-head a:hover { border-color: var(--accent); color: var(--accent); }

.bento {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  grid-template-rows: 1.1fr 0.9fr;
  gap: 18px;
  height: clamp(720px, 86vh, 940px);
}
.tile {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(28px, 3vw, 44px);
  cursor: pointer;
  transition: transform 320ms var(--ease);
}
.tile:hover { transform: translateY(-4px); }

.tile-1 { grid-column: 1 / 2; grid-row: 1 / 3; background: var(--ink); color: var(--paper); }
.tile-2 { grid-column: 2 / 3; grid-row: 1 / 2; background: var(--blk-ochre); color: var(--paper); }
.tile-3 { grid-column: 2 / 3; grid-row: 2 / 3; background: var(--paper-2); color: var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0; background: transparent; overflow: visible; }
.tile-3:hover { transform: none; }
.tile-3a, .tile-3b {
  border-radius: 12px;
  padding: clamp(24px, 2.4vw, 36px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 320ms var(--ease);
  cursor: pointer;
}
.tile-3a:hover, .tile-3b:hover { transform: translateY(-4px); }
.tile-3a { background: var(--blk-slate); color: var(--paper); }
.tile-3b { background: var(--paper-2); color: var(--ink); border: 1px solid var(--ink-line); }

/* floating decoration on bento tile-1 */
.tile-bg {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: transform 600ms var(--ease);
}
.tile-1:hover .tile-bg,
.tile-2:hover .tile-bg,
.tile-3a:hover .tile-bg { transform: scale(1.04); }

.tile-1::after {
  content: "";
  position: absolute;
  top: 28px; right: 28px;
  width: 64px; height: 64px;
  border: 1px solid rgba(232,74,28,0.6);
  border-radius: 50%;
  animation: spin-slow 22s linear infinite;
  z-index: 2;
}
.tile-1::before {
  content: "";
  position: absolute;
  top: 56px; right: 56px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  z-index: 3;
  animation: float-y-2 4.2s ease-in-out infinite;
}

const { useState, useEffect, useRef } = React;

/* ============================================================
   HOOKS / HELPERS
   ============================================================ */
function useInView(threshold = 0.18) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        setInView(true);
        io.disconnect();
      }
    }, { threshold });
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function CountUp({ to, duration = 1800, suffix = '' }) {
  const [ref, inView] = useInView(0.4);
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!inView) return;
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(to * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, to, duration]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
}

function Reveal({ children, delay = 0, as: Tag = 'div', className = '', ...rest }) {
  const [ref, inView] = useInView(0.16);
  return (
    <Tag
      ref={ref}
      className={`reveal ${inView ? 'is-in' : ''} ${className}`}
      style={{ transitionDelay: delay + 'ms' }}
      {...rest}
    >
      {children}
    </Tag>
  );
}

function ProgressRail() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const total = h.scrollHeight - window.innerHeight;
      setP(total > 0 ? Math.max(0, Math.min(1, window.scrollY / total)) : 0);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const labels = ['intro','services','approach','proof','work','voices','contact'];
  const idx = Math.min(labels.length - 1, Math.floor(p * labels.length));
  return (
    <div className="progress-rail">
      <div className="fill" style={{ height: (p * 100).toFixed(1) + '%' }}></div>
      <span className="glyph" style={{ top: (p * 100).toFixed(1) + '%' }}>
        {String(idx + 1).padStart(2, '0')} / {labels[idx]}
      </span>
    </div>
  );
}

function Manifesto() {
  const stageRef = useRef(null);
  const [active, setActive] = useState(0);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const stage = stageRef.current;
    if (!stage) return;
    const onScroll = () => {
      const rect = stage.getBoundingClientRect();
      const total = rect.height - window.innerHeight;
      if (total <= 0) return;
      const scrolled = -rect.top;
      const p = Math.max(0, Math.min(1, scrolled / total));
      setProgress(p);
      // map p to line index — 4 lines, last 10% holds final
      const slice = 1 / MANIFESTO_LINES.length;
      let idx = Math.floor(p / slice);
      if (idx >= MANIFESTO_LINES.length) idx = MANIFESTO_LINES.length - 1;
      setActive(idx);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <section className="manifesto" id="manifesto">
      <div className="manifesto-stage" ref={stageRef}>
        <div className="manifesto-pin">
          <ManifestoBg />
          <div className="manifesto-content">

                    <div className="motif-tint" />
                    <div className="motif-ring" />
                  </div>
                ))}
              </div>

              <div className="plate-numeral">
                {NUMERALS.map((n, i) => (
                  <span key={i} className={`num ${i === active ? 'is-active' : ''}`}>
                    {n}<span className="stop">.</span>
                  </span>
                ))}
              </div>

              <div className="plate-foot">
                <div className="pf-label">
                  {PLATE_LABELS[active]}
                </div>
                <div className="pf-meta">{String(active + 1)} / {MANIFESTO_LINES.length}</div>
              </div>
            </div>

            {/* RIGHT — text */}

              <div className="manifesto-eyebrow">
                <span className="line"></span>
                the practice — what we believe
              </div>
              <div className="manifesto-lines lower">
                {MANIFESTO_LINES.map((line, i) => (
                  <span key={i} className={`manifesto-line ${i === active ? 'is-active' : ''}`}>

  );
